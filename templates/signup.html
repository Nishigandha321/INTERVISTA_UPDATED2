<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090711">
  <link rel="stylesheet" href="/static/auth.css">
  <title>Sign Up · Intervista</title>
</head>
<body class="auth-page">
  <div class="space-scene" aria-hidden="true"><span class="planet"></span><span class="planet-glow"></span></div>
  <a class="auth-brand" href="/" aria-label="INTERVISTA home"><img src="/static/new_logo.png" alt=""><span>INTERVISTA</span></a>
  <main class="auth-card" aria-labelledby="auth-title">
    <div class="auth-mark" aria-hidden="true">✦</div>
    <p class="auth-eyebrow">YOUR NEXT CHAPTER</p>
    <h1 id="auth-title">Create your account</h1>
    <p class="auth-intro">Build confidence for every step ahead.</p>
    <form method="post" action="/signup">
      <label for="username">Username</label>
      <input id="username" type="text" name="username" placeholder="Choose a username" autocomplete="username" required>
      <label for="password">Password</label>
      <div class="password-wrap"><input id="password" type="password" name="password" placeholder="Create a password" autocomplete="new-password" required><button class="password-toggle" type="button" aria-controls="password" aria-pressed="false">Show</button></div>
      <button type="submit" class="auth-submit">Create Account <span aria-hidden="true">→</span></button>
    </form>
    {% if message %}<p class="auth-message" role="alert">{{ message }}</p>{% endif %}
    <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
    <p class="auth-terms">A little practice can take you a long way.</p>
  </main>
  <script src="/static/auth.js" defer></script>
</body>
</html>
