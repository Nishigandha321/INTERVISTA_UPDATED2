<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/intervista-ui.css?v=interview-text-answer-1">
<title>AI Voice Interview</title>
</head>

<body class="interview-studio">

     <nav class="navbar">
  <div class="nav-container">

    <h2 class="logo">
      <img src="/static/new_logo.png" alt="Intervista AI logo" class="logo-img">
      INTERVISTA
    </h2>

   <div class="nav-links">
  <a href="/">Home</a>
  <a href="/#features">Features</a>
  <!--<a href="/#flow">How it Works</a> -->
  <a href="/#contact">Contact</a>
</div>

      <!-- User menu -->
      <div class="user-menu">
        <button class="user-avatar" id="userAvatar">
          <span class="avatar-circle">{{ username[:1] | upper }}</span>
        </button>

        <div class="user-dropdown" id="userDropdown">
          <div class="user-dropdown-header">
            <div class="user-name">{{ username }}</div>
          </div>

          <a href="/profile" class="dropdown-item">View Dashboard</a>
          <a href="/logout" class="dropdown-item danger">Log Out</a>
        </div>
      </div>

    </div>
  </div>
</nav>

<header class="page-header">
<h1>Technical Interview</h1>
</header>


<main>

<section id="loading-phase" class="card">

<h2>{{ role }} — {{ level }}</h2>

<div class="status-indicator">
<div class="pulse-dot"></div>
<span id="loading-status">Preparing your interview questions...</span>
</div>

</section>



<section id="interview-phase" class="card" style="display:none;">

<div id="interviewer-bubble" class="interviewer-bubble">
<p id="current-question"></p>
</div>


<div id="coding-timer" style="display:none;margin-top:10px;">
<span>Thinking time: </span>
<b id="timer-value">120</b> seconds
</div>


<div id="voice-status" class="voice-status">
<div class="voice-ring" id="voice-ring"></div>
<span id="voice-status-text">Waiting...</span>
</div>

<div class="interview-text-answer">
<label for="interview-text-answer">Answer with text (optional)</label>
<textarea id="interview-text-answer" rows="5" placeholder="Type your answer here..."></textarea>
</div>

<div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;">
<button id="btn-finish-speaking" class="btn" style="display:none;">Submit Answer</button>
<button id="btn-skip" class="btn outline">Skip this question</button>
<button id="btn-end-early" class="btn outline">End interview</button>

</div>

</section>



<section id="evaluating-phase" class="card" style="display:none;">

<h2>Interview Complete</h2>

<div class="status-indicator">
<div class="pulse-dot"></div>
<span id="eval-status">Analyzing your responses...</span>
</div>

</section>

</main>



<script>
(function(){
  const SESSION_ID = {{ interview_session_id|tojson }};
  const ROUND_EXECUTABLE = {{ "true" if round_executable|default(true) else "false" }};
  const SPEECH_CONTEXT_TERMS = {{ speech_context_terms|default([])|tojson }};
  const INTERVIEW_TYPE = {{ interview_type|default('technical')|tojson }};
  const ROLE = {{ role|default('')|tojson }};
  const phase = { value: "IDLE" };
  const statusText = document.getElementById("voice-status-text");
  const ring = document.getElementById("voice-ring");
  const finishButton = document.getElementById("btn-finish-speaking");
  const answerInput = document.getElementById("interview-text-answer");
  let currentQuestion = null;
  let mediaStream = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let recordingStarted = false;
  let recordedAudio = null;
  let pendingTranscript = "";
  let answerStartedAt = 0;
  let answerInFlight = false;
  let evaluationInFlight = false;
  let answerId = "";
  let speechGeneration = 0;

  function finalizeRecording(){
    if(!recordedAudio && audioChunks.length){
      recordedAudio=new Blob(audioChunks,{type:mediaRecorder?.mimeType||"audio/webm"});
    }
    if(mediaStream)mediaStream.getTracks().forEach(track=>track.stop());
    mediaStream=null;
    return recordedAudio;
  }
  function setPhase(next, message){
    const allowed = {IDLE:["SPEAKING","PROCESSING","FINISHED"],SPEAKING:["LISTENING","PROCESSING","FINISHED"],LISTENING:["PROCESSING","FINISHED"],PROCESSING:["SPEAKING","LISTENING","FINISHED"],FINISHED:[]};
    if(next !== phase.value && !(allowed[phase.value] || []).includes(next)) return false;
    phase.value = next;
    if(message) statusText.textContent = message;
    ring.classList.toggle("active", next === "LISTENING");
    answerInput.disabled = next !== "LISTENING";
    finishButton.style.display = next === "LISTENING" ? "inline-block" : "none";
    document.getElementById("btn-skip").disabled = next !== "LISTENING" && next !== "IDLE";
    document.getElementById("btn-end-early").disabled = next === "PROCESSING" || next === "FINISHED";
    return true;
  }

  function stopRecording(){
    return new Promise(resolve=>{
      if(!mediaRecorder || mediaRecorder.state === "inactive") return resolve(finalizeRecording());
      mediaRecorder.addEventListener("stop",()=>{
        resolve(finalizeRecording());
      },{once:true});
      mediaRecorder.stop();
    });
  }
  async function startListening(){
    if(phase.value !== "LISTENING" || recordingStarted) return;
    recordingStarted=true;audioChunks=[];recordedAudio=null;pendingTranscript="";answerStartedAt=Date.now();
    answerId=crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
    finishButton.textContent="Submit Answer";
    try{
      if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) throw new Error("This browser does not support microphone recording.");
      mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
      if(phase.value !== "LISTENING"){
        mediaStream.getTracks().forEach(track=>track.stop());mediaStream=null;recordingStarted=false;return;
      }
      const candidates=["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
      const mimeType=candidates.find(type=>MediaRecorder.isTypeSupported(type));
      const recorderOptions={audioBitsPerSecond:48000};
      if(mimeType)recorderOptions.mimeType=mimeType;
      mediaRecorder=new MediaRecorder(mediaStream,recorderOptions);
      mediaRecorder.addEventListener("dataavailable",event=>{if(event.data?.size)audioChunks.push(event.data);});
      mediaRecorder.addEventListener("error",()=>{statusText.textContent="Microphone recording failed. Check microphone access and try again.";});
      mediaRecorder.start(1000);
      statusText.textContent="Recording... Pause as long as you need; press Submit Answer when finished.";
    }catch(error){
      recordingStarted=false;
      if(mediaStream)mediaStream.getTracks().forEach(track=>track.stop());mediaStream=null;
      statusText.textContent=error?.name==="NotAllowedError" ? "Microphone access is blocked. Allow microphone access, then try again." : "Could not start microphone recording. Check your microphone and browser permissions.";
      finishButton.style.display="inline-block";finishButton.disabled=false;
    }
  }
  async function transcribeAudio(blob){
    const form=new FormData();
    const extension=blob.type.includes("ogg")?"ogg":"webm";
    form.append("file",blob,`answer.${extension}`);
    const context=[ROLE,INTERVIEW_TYPE==="technical"?SPEECH_CONTEXT_TERMS.join(", "):"",currentQuestion?.question||""]
      .filter(Boolean).join(". ").slice(0,500);
    form.append("context_prompt",context);
    const response=await fetch("/api/transcribe",{method:"POST",body:form});
    if(!response.ok){
      let detail="";
      try{const data=await response.json();if(typeof data.detail==="string")detail=data.detail;}catch(_){}
      throw new Error(detail||"Transcription is unavailable right now.");
    }
    const data=await response.json();
    return (data.transcript||"").replace(/\s+/g," ").trim();
  }
  function speak(text){
    return new Promise(resolve=>{
      const generation=++speechGeneration;
      if(!( "speechSynthesis" in window))return resolve();
      window.speechSynthesis.cancel();
      const utterance=new SpeechSynthesisUtterance(text);utterance.rate=1;utterance.pitch=1;
      const finish=()=>{if(generation===speechGeneration)resolve();};utterance.onend=finish;utterance.onerror=finish;
      window.speechSynthesis.speak(utterance);
    });
  }
  async function presentQuestion(data){
    currentQuestion=data;answerInput.value="";document.getElementById("current-question").textContent=data.question;
    if(data.is_final){setPhase("FINISHED","Interview complete.");await speak(data.question);await evaluateAll();return;}
    setPhase("SPEAKING","AI is speaking...");await speak(data.question);
    if(phase.value !== "SPEAKING")return;
    setPhase("LISTENING","Starting microphone...");recordingStarted=false;startListening();
  }
  async function sendAnswer(answer,skip=false,prelocked=false,endAfter=false){
    if((answerInFlight && !prelocked) || phase.value === "PROCESSING" && !prelocked || phase.value === "FINISHED")return;
    answerInFlight=true;setPhase("PROCESSING","Saving your response...");await stopRecording();recordingStarted=false;
    try{
      const requestBody=JSON.stringify({session_id:SESSION_ID,turn_id:currentQuestion.turn_id,answer_id:answerId||(crypto.randomUUID?crypto.randomUUID():`${Date.now()}`),answer,skip,end_interview:endAfter,duration:Math.max(1,Math.round((Date.now()-answerStartedAt)/1000))});
      let response;
      for(let attempt=0;attempt<2;attempt++){
        try{response=await fetch("/api/interview/respond",{method:"POST",headers:{"Content-Type":"application/json"},body:requestBody});if(response.ok)break;}
        catch(_){if(attempt===1)throw new Error("Connection unavailable");}
      }
      if(!response.ok)throw new Error("Could not process that answer");
      const next=await response.json();answerInFlight=false;
      if(endAfter)await evaluateAll();else await presentQuestion(next);
    }catch(_){
      answerInFlight=false;
      if(phase.value !== "FINISHED"){
        setPhase("LISTENING","Connection interrupted. Your answer is saved here; press Submit Answer again.");
      }
    }
  }
  async function submitAnswer(endAfter=false){
    if(phase.value !== "LISTENING" || answerInFlight)return;
    const typedAnswer=answerInput.value.trim();
    if(typedAnswer){
      if(!answerStartedAt)answerStartedAt=Date.now();
      await sendAnswer(typedAnswer,false,false,endAfter);
      return;
    }
    if(!recordedAudio && (!recordingStarted || !mediaRecorder || mediaRecorder.state !== "recording")){
      statusText.textContent="Microphone is starting. Please wait, then press Submit Answer.";
      if(!recordingStarted)startListening();
      return;
    }
    answerInFlight=true;
    setPhase("PROCESSING","Transcribing your answer...");
    let audio;
    try{audio=recordedAudio || await stopRecording();recordingStarted=false;}
    catch(_){answerInFlight=false;setPhase("LISTENING","The recording could not be finalized. Press Submit Answer again to retry.");return;}
    let answer=pendingTranscript;
    try{if(!answer)answer=audio ? await transcribeAudio(audio) : "";}catch(error){
      answerInFlight=false;setPhase("LISTENING",`${error?.message||"Transcription is unavailable right now."} Your recording is kept; press Submit Answer to try again.`);
      recordedAudio=audio;return;
    }
    if(!answer){
      answerInFlight=false;
      setPhase("LISTENING","No speech was recognized. Your recording is kept; press Submit Answer to try again.");
      recordedAudio=audio;return;
    }
    pendingTranscript=answer;
    recordingStarted=true;await sendAnswer(answer,false,true,endAfter);
  }
  async function evaluateAll(endEarly=false){
    if(evaluationInFlight)return;evaluationInFlight=true;await stopRecording();recordingStarted=false;
    if(window.speechSynthesis)window.speechSynthesis.cancel();
    setPhase("FINISHED","Preparing your interview feedback...");
    document.getElementById("interview-phase").style.display="none";document.getElementById("evaluating-phase").style.display="block";
    try{
      const response=await fetch("/api/interview/evaluate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:SESSION_ID,end_interview:endEarly})});
      if(!response.ok)throw new Error("Evaluation unavailable");
      const data=await response.json();window.location.href=data.redirect_url||"/report";
    }catch(_){evaluationInFlight=false;document.getElementById("eval-status").textContent="Feedback could not be prepared. Please try again.";}
  }
  finishButton.addEventListener("click",()=>submitAnswer(false));
  document.getElementById("btn-skip").addEventListener("click",()=>{
    if(phase.value !== "LISTENING" && phase.value !== "IDLE")return;
    if(!answerId)answerId=crypto.randomUUID?crypto.randomUUID():`${Date.now()}`;
    sendAnswer("(skipped)",true,false);
  });
  document.getElementById("btn-end-early").addEventListener("click",async()=>{
    if(answerInFlight || evaluationInFlight)return;
    if(phase.value === "LISTENING" && (recordingStarted || recordedAudio || pendingTranscript || answerInput.value.trim())){
      await submitAnswer(true);return;
    }
    if(!(currentQuestion && (currentQuestion.turn_count || 0) > 0)){
      window.location.href="/";return;
    }
    await evaluateAll(true);
  });
  async function init(){
    if(!ROUND_EXECUTABLE){document.getElementById("loading-status").textContent="This interview round is not available yet.";return;}
    try{
      const response=await fetch("/api/interview/next_question",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:SESSION_ID})});
      if(!response.ok)throw new Error("Interview unavailable");
      const first=await response.json();document.getElementById("loading-phase").style.display="none";document.getElementById("interview-phase").style.display="block";await presentQuestion(first);
    }catch(_){document.getElementById("loading-status").textContent="We couldn’t start the interview. Please return to setup and try again.";}
  }
  init();
})();
</script>

</body>
</html>
