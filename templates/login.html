<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090711">
  <link rel="stylesheet" href="/static/auth.css">
  <title>Sign In · Intervista</title>
</head>
<body class="auth-page">
  <div class="space-scene" aria-hidden="true"><span class="planet"></span><span class="planet-glow"></span></div>
  <a class="auth-brand" href="/" aria-label="INTERVISTA home"><img src="/static/new_logo.png" alt=""><span>INTERVISTA</span></a>
  <main class="auth-card" aria-labelledby="auth-title">
    <div class="auth-mark" aria-hidden="true">✦</div>
    <p class="auth-eyebrow">WELCOME BACK</p>
    <h1 id="auth-title">Sign in to INTERVISTA</h1>
    <p class="auth-intro">Your next opportunity is closer than you think.</p>
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" type="text" name="username" placeholder="Your username" autocomplete="username" required>
      <div class="password-label"><label for="password">Password</label><a class="forgot-link" href="mailto:support@intervista.ai?subject=Password%20reset%20request">Forgot password?</a></div>
      <div class="password-wrap"><input id="password" type="password" name="password" placeholder="Your password" autocomplete="current-password" required><button class="password-toggle" type="button" aria-controls="password" aria-pressed="false">Show</button></div>
      <button type="submit" class="auth-submit">Sign In <span aria-hidden="true">→</span></button>
    </form>
    {% if message %}<p class="auth-message" role="alert">{{ message }}</p>{% endif %}
    <p class="auth-switch">New to Intervista? <a href="/signup">Create an account</a></p>
    <p class="auth-terms">By continuing, you agree to prepare for your next great opportunity.</p>
  </main>
  <script src="/static/auth.js" defer></script>
</body>
</html>
