<aside class="iv-sidebar" aria-label="INTERVISTA workspace">
  <a href="/" class="iv-brand"><span class="iv-brand-mark" aria-hidden="true">✧</span><span>INTERVISTA</span></a>
  <div class="iv-user-card"><span class="iv-avatar">{{ (username or 'U')[:1]|upper }}</span><span class="iv-user-copy"><strong>{{ display_name|default(username, true) }}</strong><small>Candidate</small></span></div>
  <nav class="iv-primary-nav" aria-label="Workspace navigation">
    <a href="/"{% if active_page == 'dashboard' %} class="is-active" aria-current="page"{% endif %}><i aria-hidden="true">⌂</i><span>Dashboard</span></a>
    <a href="/index"{% if active_page == 'mock' %} class="is-active" aria-current="page"{% endif %}><i aria-hidden="true">◉</i><span>Mock Interviews</span></a>
    <a href="/coding"{% if active_page == 'coding' %} class="is-active" aria-current="page"{% endif %}><i aria-hidden="true">⌘</i><span>Coding Round</span></a>
    <a href="/gd"{% if active_page == 'gd' %} class="is-active" aria-current="page"{% endif %}><i aria-hidden="true">◌</i><span>Group Discussion</span></a>
    <a href="/interview-history"{% if active_page == 'history' %} class="is-active" aria-current="page"{% endif %}><i aria-hidden="true">◷</i><span>Interview History</span></a>
  </nav>
  <nav class="iv-account-nav" aria-label="Account navigation">
    <a href="/profile"{% if active_page == 'profile' %} class="is-active" aria-current="page"{% endif %}><i aria-hidden="true">◯</i><span>Profile</span></a>
    <a class="iv-logout" href="/logout"><i aria-hidden="true">↪</i><span>Logout</span></a>
  </nav>
</aside>
